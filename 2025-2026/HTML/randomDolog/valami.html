<!doctype html>
<html lang="hu">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Szerviz Weboldal</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    </head>
    <body>
        <!-- FEJLÉC -->
        <header class="bg-dark text-white text-center p-3">
            <img src="header.jpg" class="img-fluid mb-2" alt="Szerviz fejléc kép" title="Szerviz" />
            <h1>Autószerviz</h1>
            <p>Készítette: Név | Dátum: 2026</p>
        </header>

        <!-- MENÜ -->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand" href="#">Szerviz</a>
                <div>
                    <a class="nav-link d-inline" href="#">Főoldal</a>
                    <a class="nav-link d-inline" href="#masik">Másik oldal</a>
                </div>
            </div>
        </nav>

        <!-- FŐOLDAL -->
        <div class="container mt-4">
            <h2>Főoldal</h2>

            <!-- 1 HASÁB -->
            <div class="row">
                <div class="col-12">
                    <img src="szerelo.jpg" class="img-fluid" alt="Szerelő munka közben" title="Szerelő" />
                    <p>Tapasztalt szerelőink gyors és megbízható munkát végeznek.</p>
                </div>
            </div>

            <!-- 2 HASÁB -->
            <div class="row mt-4">
                <div class="col-md-6">
                    <img src="szerviz.jpg" class="img-fluid" alt="Szerviz belső tér" title="Szerviz" />
                </div>
                <div class="col-md-6">
                    <p>Modern felszereltségű műhely.</p>
                </div>
            </div>

            <!-- 3 HASÁB -->
            <div class="row mt-4">
                <div class="col-md-4">Olajcsere</div>
                <div class="col-md-4">Diagnosztika</div>
                <div class="col-md-4">Gumicsere</div>
            </div>
        </div>

        <!-- MÁSODIK OLDAL -->
        <div class="container mt-5" id="masik">
            <h2>Másik oldal</h2>
            <p>További információk a szolgáltatásainkról.</p>
        </div>

        <!-- LÁBLÉC -->
        <footer class="bg-dark text-white text-center p-3 mt-5">
            <p>&copy; 2026 Szerviz</p>
        </footer>
    </body>
</html>
